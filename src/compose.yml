services:
  nextapp:
    container_name: nextapp
    build:
      context: ./frontend/front-end
      dockerfile: next.dockerfile
      args:
        NEXT_PUBLIC_LOCAL_URL: ${NEXT_PUBLIC_LOCAL_URL:-http://127.0.0.1:8080}
    image: nextapp:1.0.0
    env_file: ./frontend/front-end/.env
    environment:
      FLASK_INTERNAL_URL: http://flaskapp:8080
    ports:
      - "3000:3000"
    depends_on:
      - flaskapp

  flaskapp:
    container_name: flaskapp
    image: flaskapp:1.0.0
    build:
      context: ./backend
      dockerfile: flask.dockerfile
    env_file: ./backend/.env
    ports:
      - "8080:8080"
